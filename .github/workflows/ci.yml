name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-analysis:
    uses: ./.github/workflows/static-analysis.yml
  unit-tests:
    needs: [static-analysis]
    uses: ./.github/workflows/unit-tests.yml
  e2e-tests:
    needs: [unit-tests]
    uses: ./.github/workflows/e2e-tests.yml
