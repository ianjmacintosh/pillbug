name: End-to-End Tests
on:
  workflow_call:
jobs:
  test:
    name: Test with Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.1-noble
    env:
      EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
      PIN_SECRET: ${{ secrets.PIN_SECRET }}
      VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Use pre-installed Chromium for miniflare browser binding
        run: |
          CHROME_PATH=$(find /ms-playwright -name chrome -path "*/chrome-linux/chrome" 2>/dev/null | head -1)
          [ -n "$CHROME_PATH" ] && echo "MINIFLARE_CHROME_EXECUTABLE=$CHROME_PATH" >> $GITHUB_ENV
      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply pillbug-staging --env staging --local
      - name: Seed test accounts (local)
        run: npm run db:seed:local
      - name: Write .env for local Worker
        run: |
          printf 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA\nEMAIL_SECRET=%s\nPIN_SECRET=%s\n' \
            "$EMAIL_SECRET" "$PIN_SECRET" > .env
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
