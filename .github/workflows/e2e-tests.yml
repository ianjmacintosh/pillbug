name: End-to-End Tests
on:
  workflow_call:
jobs:
  test:
    name: Test with Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Create .dev.vars for Playwright dev server
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "Env var length: ${#RESEND_API_KEY}"
          echo "RESEND_API_KEY=$RESEND_API_KEY" >> .dev.vars
      - name: Verify .dev.vars
        run: |
          echo "File exists: $(test -f .dev.vars && echo yes || echo no)"
          echo "RESEND_API_KEY present: $(grep -c RESEND_API_KEY .dev.vars)"
          echo "RESEND_API_KEY value length: $(grep RESEND_API_KEY .dev.vars | cut -d= -f2 | wc -c)"
          echo "Contents (masked):"
          sed 's/=.*/=***/' .dev.vars
          echo "Special characters:"
          cat -A .dev.vars
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
